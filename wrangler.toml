[vars]
GOOGLE_CLIENT_ID = "273765990336-id4d6tq1b77lqq35si9rk66eb94k16h3.apps.googleusercontent.com"
ALLOWED_EMAILS = "loidaegr@gmail.com,ortegafull87@gmail.com,kuukum.mx@gmail.com"
ODOO_URL = "https://kuukum.odoo.com"
# Destino de los correos de "Reportar un problema".
REPORTES_EMAIL = "hola@kuukum.mx"
# Solo si Odoo pide la base de datos explícita (normalmente no en odoo.com):
ODOO_DB = ""

# Crea el namespace con:  npx wrangler kv namespace create KK
# y pega aquí el id que te devuelve.
[[kv_namespaces]]
binding = "KK"
id = "b37bc3ef3eda4c3baedd14643aecdd50"

# Secretos (no van en este archivo):
#   npx wrangler pages secret put ODOO_API_KEY
#   npx wrangler pages secret put SESSION_SECRET
#   npx wrangler pages secret put SEAL_SECRET

# ---------- Preview (rama staging y demás previews) ----------
